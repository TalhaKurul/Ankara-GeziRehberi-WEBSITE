<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="konu">Ankara Rehberi</div>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="gezilecek-yerler.html">Gezilecek Yerler</a></li>
                <li><a href="lezzetler.html">Lezzetler</a></li>
                <li><a href="iletisim.html">İletişim</a></li>
            </ul>
        </nav>
    </header>

    <h2 class="baslik">Bize Ulaşın</h2>

    
    <section class="container-iletisim">
        
        <div class="iletisim-info">
            <h2>İletişim Bilgileri</h2>
            <p><strong>Adres:</strong> Kızılay Meydanı, Çankaya / Ankara</p>
            <p><strong>E-Posta:</strong> info@ankararehberi.com</p>
            <p><strong>Proje Amacı:</strong> Bu site İnternet Tabanlı Programlama dersi ödevi için hazırlanmıştır.</p>
        </div>

      
        <div class="iletisim-form">
            <h2>Mekan Önerin</h2>
            <form action="#">
                <div class="form-info">
                    <label>Adınız Soyadınız:</label>
                    <input type="text" required placeholder="Adınızı giriniz...">
                </div>
                <div class="form-info">
                    <label>E-Posta Adresiniz:</label>
                    <input type="email" required placeholder="ornek@mail.com">
                </div>
                <div class="form-info">
                    <label>Öneri ve Mesajınız:</label>
                    <textarea rows="5" required placeholder="Ankara'da şuraya da gidilmeli..."></textarea>
                </div>
                <button type="submit">Mesajı Gönder</button>
            </form>
        </div>

    </section>

    

</body>
